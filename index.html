<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo de Funcionário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Calculadora de Custo de Funcionário</h1>
            <p>Simulação de encargos trabalhistas e salário líquido</p>
        </header>

        <form id="form-calculadora">
            <h2>Dados do Colaborador e Empresa</h2>

            <div class="campo-grupo">
                <label for="nome_funcionario">Nome do Funcionário</label>
                <input type="text" id="nome_funcionario" name="nome_funcionario" placeholder="Ex: Maria Oliveira" required>
            </div>

            <div class="linha-dupla">
                <div class="campo-grupo">
                    <label for="salario_bruto">Salário Bruto (R$)</label>
                    <input type="number" id="salario_bruto" name="salario_bruto" step="0.01" min="0" placeholder="0,00" required>
                </div>

                <div class="campo-grupo">
                    <label for="dependentes">Dependentes IRRF</label>
                    <input type="number" id="dependentes" name="dependentes" min="0" value="0">
                </div>
            </div>

            <div class="campo-grupo">
                <label for="regime_empresa">Regime Tributário da Empresa</label>
                <select id="regime_empresa" name="regime_empresa">
                    <option value="simples">Simples Nacional (Anexos I, II, III e V)</option>
                    <option value="simples_anexo4">Simples Nacional (Anexo IV)</option>
                    <option value="lucro_presumido">Lucro Presumido / Real</option>
                </select>
            </div>

            <button type="submit" class="btn-calcular">Calcular Custo e Líquido</button>

            <section class="secao-resultados">
                <h2>Demonstrativo de Resultados</h2>

                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label for="inss">(-) INSS do Funcionário (R$)</label>
                        <input type="number" id="inss" name="inss" step="0.01" placeholder="0,00" readonly>
                    </div>

                    <div class="campo-grupo">
                        <label for="irrf">(-) IRRF (R$)</label>
                        <input type="number" id="irrf" name="irrf" step="0.01" placeholder="0,00" readonly>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="campo-grupo destaque-liquido">
                        <label for="salario_liquido">(=) Salário Líquido (R$)</label>
                        <input type="number" id="salario_liquido" name="salario_liquido" step="0.01" placeholder="0,00" readonly>
                    </div>

                    <div class="campo-grupo destaque-custo">
                        <label for="custo_empresa">(=) Custo Mensal Empresa (R$)</label>
                        <input type="number" id="custo_empresa" name="custo_empresa" step="0.01" placeholder="0,00" readonly>
                    </div>
                </div>
            </section>
        </form>
    </main>

    <div class="linha-dupla">
                    <div class="campo-grupo destaque-liquido">
                        <label for="salario_liquido">(=) Salário Líquido (R$)</label>
                        <input type="number" id="salario_liquido" name="salario_liquido" step="0.01" placeholder="0,00" readonly>
                    </div>

                    <div class="campo-grupo destaque-custo">
                        <label for="custo_empresa">(=) Custo Mensal Empresa (R$)</label>
                        <input type="number" id="custo_empresa" name="custo_empresa" step="0.01" placeholder="0,00" readonly>
                    </div>
                </div>
            </section>
        </form>
    </main>

    <!-- Adicione esta linha aqui -->
    <script src="script.js"></script>
</body>
</html>
</body>
</html>
